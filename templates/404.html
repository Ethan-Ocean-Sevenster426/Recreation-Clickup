<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Luma</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0E0B24; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .container { text-align: center; padding: 2rem; max-width: 420px; }
        .code { font-size: 6rem; font-weight: 800; color: #054B70; line-height: 1; margin-bottom: 0.5rem; }
        .title { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.75rem; }
        .message { font-size: 0.875rem; color: rgba(255,255,255,0.5); line-height: 1.6; margin-bottom: 2rem; }
        .btn { display: inline-block; padding: 0.625rem 1.5rem; background: #054B70; color: #fff; text-decoration: none; border-radius: 6px; font-size: 0.875rem; font-weight: 500; transition: background 0.15s; }
        .btn:hover { background: #065a87; }
    </style>
</head>
<body>
    <div class="container">
        <div class="code">404</div>
        <div class="title">Page not found</div>
        <p class="message">The page you're looking for doesn't exist or has been moved.</p>
        <a href="/workspaces/" class="btn">Go to Dashboard</a>
    </div>
</body>
</html>
