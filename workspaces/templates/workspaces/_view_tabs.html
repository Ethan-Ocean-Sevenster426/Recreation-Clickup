{# Expects: view, task_list, workspace #}
<div class="px-6 pt-4">
    <div class="flex items-center gap-2 text-ms-neutral-80">
        <a href="{% url 'workspaces:detail' workspace.id %}" class="text-sm text-ms-neutral-60 hover:text-ms-blue">{{ workspace.name }}</a>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A19F9D" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
        {% include 'workspaces/_list_chip.html' with tl=task_list size='md' %}
        <span class="font-semibold text-sm">{{ task_list.name }}</span>
    </div>
</div>

<div class="px-6 mt-3 border-b border-ms-neutral-30">
    <div class="flex items-center gap-1">
        <a href="{% url 'workspaces:list_detail' task_list.id %}"
           class="flex items-center gap-1.5 px-3 py-2 text-sm font-medium {% if view == 'list' %}text-ms-blue border-b-2 border-ms-blue{% else %}text-ms-neutral-60 hover:text-ms-neutral-80{% endif %}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            List
        </a>
        <a href="{% url 'workspaces:list_board' task_list.id %}"
           class="flex items-center gap-1.5 px-3 py-2 text-sm font-medium {% if view == 'board' %}text-ms-blue border-b-2 border-ms-blue{% else %}text-ms-neutral-60 hover:text-ms-neutral-80{% endif %}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="12" rx="1"/></svg>
            Board
        </a>
        <a href="{% url 'workspaces:list_calendar' task_list.id %}"
           class="flex items-center gap-1.5 px-3 py-2 text-sm font-medium {% if view == 'calendar' %}text-ms-blue border-b-2 border-ms-blue{% else %}text-ms-neutral-60 hover:text-ms-neutral-80{% endif %}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            Calendar
        </a>
        <a href="{% url 'workspaces:list_gantt' task_list.id %}"
           class="flex items-center gap-1.5 px-3 py-2 text-sm font-medium {% if view == 'gantt' %}text-ms-blue border-b-2 border-ms-blue{% else %}text-ms-neutral-60 hover:text-ms-neutral-80{% endif %}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="12" y2="6"/><line x1="7" y1="12" x2="18" y2="12"/><line x1="10" y1="18" x2="21" y2="18"/></svg>
            Gantt
        </a>
    </div>
</div>
