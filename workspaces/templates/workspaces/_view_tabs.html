{# Expects: view, task_list, workspace #}
<div class="px-6 pt-4 border-b border-white/10">

    <!-- Workspace name + current list breadcrumb -->
    <div class="flex items-center gap-2 mb-2.5">
        <span class="w-6 h-6 rounded bg-cu-accent text-white text-xs font-bold inline-flex items-center justify-center flex-shrink-0 select-none">{{ workspace.name|slice:":1"|upper }}</span>
        <a href="{% url 'workspaces:detail' workspace.id %}" class="text-sm font-semibold text-white hover:text-cu-accent transition-colors">{{ workspace.name }}</a>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
        {% include 'workspaces/_list_chip.html' with tl=task_list size='sm' %}
        <span class="text-sm font-medium text-white/80">{{ task_list.name }}</span>
    </div>

    <!-- Tab bar — matches workspace overview: Add List · Overview · List · Board · Calendar · Gantt  ···  Custom fields · Members -->
    <div class="flex items-center min-w-0">
        <!-- Left tabs -->
        <div class="flex items-center gap-0 overflow-x-auto flex-1 min-w-0" style="scrollbar-width:none;">

            <!-- + Add List -->
            <button type="button" onclick="document.getElementById('newListModalVT').classList.remove('hidden')"
                    class="px-3 py-2 text-sm text-white/45 hover:text-white transition-colors whitespace-nowrap flex-shrink-0">
                + Add List
            </button>

            <!-- Overview -->
            <a href="{% url 'workspaces:detail' workspace.id %}"
               class="px-3 py-2 text-sm font-medium text-white/55 hover:text-white whitespace-nowrap flex-shrink-0 inline-flex items-center gap-1.5 transition-colors">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                Overview
            </a>

            <!-- List -->
            <a href="{% url 'workspaces:list_detail' task_list.id %}"
               class="px-3 py-2 text-sm font-medium whitespace-nowrap flex-shrink-0 inline-flex items-center gap-1.5 transition-colors
                      {% if view == 'list' %}text-cu-accent border-b-2 border-cu-accent{% else %}text-white/55 hover:text-white{% endif %}">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                List
            </a>

            <!-- Board -->
            <a href="{% url 'workspaces:list_board' task_list.id %}"
               class="px-3 py-2 text-sm font-medium whitespace-nowrap flex-shrink-0 inline-flex items-center gap-1.5 transition-colors
                      {% if view == 'board' %}text-cu-accent border-b-2 border-cu-accent{% else %}text-white/55 hover:text-white{% endif %}">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="12" rx="1"/></svg>
                Board
            </a>

            <!-- Calendar -->
            <a href="{% url 'workspaces:list_calendar' task_list.id %}"
               class="px-3 py-2 text-sm font-medium whitespace-nowrap flex-shrink-0 inline-flex items-center gap-1.5 transition-colors
                      {% if view == 'calendar' %}text-cu-accent border-b-2 border-cu-accent{% else %}text-white/55 hover:text-white{% endif %}">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                Calendar
            </a>

            <!-- Gantt -->
            <a href="{% url 'workspaces:list_gantt' task_list.id %}"
               class="px-3 py-2 text-sm font-medium whitespace-nowrap flex-shrink-0 inline-flex items-center gap-1.5 transition-colors
                      {% if view == 'gantt' %}text-cu-accent border-b-2 border-cu-accent{% else %}text-white/55 hover:text-white{% endif %}">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><line x1="3" y1="6" x2="12" y2="6"/><line x1="7" y1="12" x2="18" y2="12"/><line x1="10" y1="18" x2="21" y2="18"/></svg>
                Gantt
            </a>
        </div>

        <!-- Right: Categories -->
        <div class="flex items-center gap-0 flex-shrink-0 pl-2 border-l border-white/10 ml-2">
            <a href="{% url 'workspaces:custom_field_manager' workspace.id %}"
               class="px-3 py-2 text-xs text-white/50 hover:text-cu-accent whitespace-nowrap inline-flex items-center gap-1 transition-colors">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 7h16M4 12h10M4 17h6"/></svg>
                Categories
            </a>
        </div>
    </div>
</div>

<!-- Add List mini-modal (available from all list views) -->
<div id="newListModalVT" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4"
     onclick="if(event.target===this)this.classList.add('hidden')">
    <div class="bg-cu-panel rounded-xl p-6 w-full max-w-sm shadow-2xl border border-white/10">
        <h2 class="text-base font-semibold mb-4 text-white">New list in {{ workspace.name }}</h2>
        <form method="post" action="{% url 'workspaces:list_create' workspace.id %}" class="space-y-3">
            {% csrf_token %}
            <input name="name" required autofocus placeholder="List name…"
                   class="w-full px-3 py-2 border border-white/10 rounded-lg bg-cu-sidebar text-white placeholder-white/30 focus:ring-2 focus:ring-cu-accent focus:border-transparent outline-none text-sm">
            <div class="flex justify-end gap-2 pt-1">
                <button type="button" onclick="document.getElementById('newListModalVT').classList.add('hidden')"
                        class="px-4 py-2 text-sm text-white/70 border border-white/10 rounded-lg hover:bg-cu-sidebar-hover">Cancel</button>
                <button type="submit"
                        class="px-4 py-2 text-sm rounded-lg bg-gradient-to-r from-cu-pink via-cu-purple to-cu-blue hover:opacity-90 text-white font-medium">Create list</button>
            </div>
        </form>
    </div>
</div>
