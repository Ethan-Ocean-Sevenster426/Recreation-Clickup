{# Microsoft-styled Add Task modal. Expects: task_list, status_choices, priority_choices, users #}
<div id="newTaskModal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-lg w-full max-w-2xl shadow-2xl border border-ms-neutral-30 flex flex-col max-h-[90vh] overflow-hidden">
        <!-- Header -->
        <div class="flex items-center justify-between px-5 pt-4 pb-3 border-b border-ms-neutral-20">
            <h2 class="text-base font-semibold text-ms-neutral-80">New task · {{ task_list.name }}</h2>
            <button type="button" onclick="document.getElementById('newTaskModal').classList.add('hidden')"
                    class="w-8 h-8 rounded hover:bg-ms-neutral-10 text-ms-neutral-60 flex items-center justify-center">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>

        <form method="post" action="{% url 'workspaces:task_create' task_list.id %}" class="flex-1 overflow-auto">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ request.get_full_path }}">

            <!-- Title -->
            <div class="px-5 pt-4">
                <input name="title" required autofocus
                       placeholder="Task name"
                       class="w-full px-3 py-2.5 border border-ms-neutral-30 rounded text-base focus:ring-2 focus:ring-ms-blue focus:border-ms-blue outline-none">
            </div>

            <!-- Description -->
            <div class="px-5 pt-3">
                <textarea name="description" rows="3"
                          placeholder="Add a description"
                          class="w-full px-3 py-2 border border-ms-neutral-30 rounded text-sm focus:ring-2 focus:ring-ms-blue focus:border-ms-blue outline-none resize-none"></textarea>
            </div>

            <!-- Fields grid -->
            <div class="px-5 pt-4 grid grid-cols-2 gap-4">
                <label class="text-xs font-medium text-ms-neutral-60">
                    Status
                    <select name="status" class="mt-1 w-full px-2 py-1.5 border border-ms-neutral-30 rounded text-sm bg-white focus:ring-2 focus:ring-ms-blue outline-none">
                        {% for key, label in status_choices %}
                        <option value="{{ key }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </label>
                <label class="text-xs font-medium text-ms-neutral-60">
                    Priority
                    <select name="priority" class="mt-1 w-full px-2 py-1.5 border border-ms-neutral-30 rounded text-sm bg-white focus:ring-2 focus:ring-ms-blue outline-none">
                        {% for key, label in priority_choices %}
                        <option value="{{ key }}" {% if key == 'normal' %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </label>
                <label class="text-xs font-medium text-ms-neutral-60">
                    Assignee
                    <select name="assignee" class="mt-1 w-full px-2 py-1.5 border border-ms-neutral-30 rounded text-sm bg-white focus:ring-2 focus:ring-ms-blue outline-none">
                        <option value="">Unassigned</option>
                        {% for u in users %}
                        <option value="{{ u.id }}">{{ u.get_full_name|default:u.username }}</option>
                        {% endfor %}
                    </select>
                </label>
                <label class="text-xs font-medium text-ms-neutral-60">
                    Tags (comma separated)
                    <input type="text" name="tags" placeholder="design, urgent"
                           class="mt-1 w-full px-2 py-1.5 border border-ms-neutral-30 rounded text-sm focus:ring-2 focus:ring-ms-blue outline-none">
                </label>
                <label class="text-xs font-medium text-ms-neutral-60">
                    Start date
                    <input type="date" name="start_date"
                           class="mt-1 w-full px-2 py-1.5 border border-ms-neutral-30 rounded text-sm focus:ring-2 focus:ring-ms-blue outline-none">
                </label>
                <label class="text-xs font-medium text-ms-neutral-60">
                    Due date
                    <input type="date" name="due_date"
                           class="mt-1 w-full px-2 py-1.5 border border-ms-neutral-30 rounded text-sm focus:ring-2 focus:ring-ms-blue outline-none">
                </label>
            </div>

            <!-- Footer -->
            <div class="mt-5 px-5 py-3 border-t border-ms-neutral-20 flex items-center justify-end gap-2 bg-ms-neutral-10">
                <button type="button" onclick="document.getElementById('newTaskModal').classList.add('hidden')"
                        class="px-4 py-2 text-sm text-ms-neutral-80 border border-ms-neutral-30 rounded hover:bg-white">Cancel</button>
                <button type="submit"
                        class="px-4 py-2 text-sm rounded bg-ms-blue text-white font-medium hover:bg-ms-blue-dark">Create task</button>
            </div>
        </form>
    </div>
</div>
